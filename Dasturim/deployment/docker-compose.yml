services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file:
      - ../.env
    environment:
      DATAFLOW_AUTH_ENABLED: "true"
      DATAFLOW_SECURE_COOKIES: "true"
      DATAFLOW_BOOTSTRAP_TOKEN: ${DATAFLOW_BOOTSTRAP_TOKEN:?Set a unique bootstrap token in the root .env file}
      DATAFLOW_SANDBOX_TOKEN: ${DATAFLOW_SANDBOX_TOKEN:?Set a unique sandbox token in the root .env file}
      DATAFLOW_CORS_ORIGINS: "https://${DOMAIN}"
      DATAFLOW_DATA_DIR: /data
      DATAFLOW_AI_ENV_FILE: /data/ai.env
      DATAFLOW_PYTHON_SANDBOX: docker
      DATAFLOW_PYTHON_SANDBOX_URL: http://sandbox-controller:8787/run
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    volumes:
      - data:/data
    depends_on:
      sandbox-controller:
        condition: service_healthy
    networks:
      - app
      - sandbox
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped

  sandboxd:
    image: docker:27-dind-rootless
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--storage-driver=vfs"]
    privileged: true
    volumes:
      - sandboxd_data:/home/user/.local/share/docker
    networks:
      - sandbox
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "docker", "--host", "tcp://127.0.0.1:2375", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  sandbox-controller:
    build:
      context: ..
      dockerfile: deployment/sandbox-controller/Dockerfile
    environment:
      DOCKER_HOST: tcp://sandboxd:2375
      DATAFLOW_SANDBOX_TOKEN: ${DATAFLOW_SANDBOX_TOKEN:?Set a unique sandbox token in the root .env file}
    depends_on:
      sandboxd:
        condition: service_healthy
    networks:
      - sandbox
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  proxy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the root .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - app
    restart: unless-stopped

volumes:
  data:
  sandboxd_data:
  caddy_data:
  caddy_config:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  sandbox:
    driver: bridge
